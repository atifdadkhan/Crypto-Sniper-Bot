name: Python Tests

on:
  push:
    branches: ["main", "audit/**", "codex/**"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest -q

      - name: Compile and dry-import Render entry point (dummy credentials only)
        env:
          TELEGRAM_TOKEN: "123456:CI_DUMMY_TOKEN_NOT_REAL"
          ADMIN_ID: "123456"
          DATA_DIR: "/tmp/at-trendhive-ci"
        run: |
          python -m compileall -q main.py config.py exchange.py strategy.py indicators.py formatting.py delivery.py macro_policy.py spot_strategy_engines.py spot_signal_journal.py research/supplied_spot_strategy_library.py backtesting/download_binance.py backtesting/spot_strategy_runner.py backtesting/aggregate_spot_strategy_results.py scripts/spot_signal_scan.py
          python -c "import main; assert main.settings.admin_id == 123456; print('Render entry point imports cleanly')"
