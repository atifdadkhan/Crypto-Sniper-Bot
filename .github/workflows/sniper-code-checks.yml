name: Sniper code checks
on:
  push:
  pull_request:
jobs:
  candle-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install pytest pandas numpy
      - name: Syntax checks
        run: python -m compileall -q .
      - name: Candle intelligence unit tests (synthetic candles only)
        run: python -m pytest -q tests/test_candle_intelligence.py tests/test_strategy_modes.py
