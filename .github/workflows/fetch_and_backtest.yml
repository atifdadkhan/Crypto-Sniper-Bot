name: Fetch FULL Bitget Market and Backtest

on:
  workflow_dispatch:
    inputs:
      days:
        description: "Historical days to fetch"
        required: true
        default: "365"
      min_quote_volume:
        description: "Preferred 24h USDT turnover; lower-turnover fallback is controlled by the absolute floor"
        required: true
        default: "500000"
      absolute_min_quote_volume:
        description: "Hard minimum 24h USDT turnover; never relaxed below this"
        required: true
        default: "100000"
      min_history_days:
        description: "Minimum acceptable history when requested lookback is unavailable"
        required: true
        default: "90"
      max_symbols:
        description: "Target fully eligible markets after history validation; 0 means ALL"
        required: true
        default: "20"
      fee_slippage_pct:
        description: "Estimated combined round-trip fees + slippage (% notional)"
        required: true
        default: "0.12"
      funding_bps_per_8h:
        description: "Funding sensitivity assumption (bps per 8h; not historical funding)"
        required: true
        default: "0"

permissions:
  contents: read

jobs:
  fetch-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run deterministic tests
        run: pytest -q

      - name: Discover and download eligible Bitget USDT perpetual markets
        run: |
          python -m backtesting.download_bitget --symbols auto \
            --days "${{ inputs.days }}" \
            --min-quote-volume "${{ inputs.min_quote_volume }}" \
            --absolute-min-quote-volume "${{ inputs.absolute_min_quote_volume }}" \
            --min-history-days "${{ inputs.min_history_days }}" \
            --max-symbols "${{ inputs.max_symbols }}" --out data

      - name: Backtest every complete downloaded market
        run: |
          python -m backtesting.backtest --data-dir data --symbols auto \
            --fee-slippage-pct "${{ inputs.fee_slippage_pct }}" \
            --funding-bps-per-8h "${{ inputs.funding_bps_per_8h }}"

      - name: Upload historical data and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: at-trendhive-full-bitget-market-backtest
          path: |
            data/
            backtest_results/
          if-no-files-found: warn
