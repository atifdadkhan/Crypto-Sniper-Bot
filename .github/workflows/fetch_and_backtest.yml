name: Fetch BTC ETH Bitget Data and Multi-Strategy Backtest

on:
  workflow_dispatch:
    inputs:
      days:
        description: "Historical days to fetch if no prior dataset artifact is available"
        required: true
        default: "365"
      min_history_days:
        description: "Minimum acceptable history for each timeframe"
        required: true
        default: "120"
      fee_slippage_pct:
        description: "Estimated combined round-trip fees + slippage (% notional)"
        required: true
        default: "0.12"
      funding_bps_per_8h:
        description: "Funding sensitivity assumption (bps per 8h; not historical funding)"
        required: true
        default: "0"
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

permissions:
  contents: read
  actions: read

jobs:
  fetch-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run deterministic tests
        run: python -m pytest -q

      - name: Reuse previously downloaded BTC ETH dataset
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: at-trendhive-btc-eth-timeframe-backtest
          run-id: 41714564038
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          path: .

      - name: Download BTC and ETH if no reusable dataset exists
        if: ${{ always() }}
        run: |
          if [ ! -f data/timeframe_manifest.json ]; then
            python -m backtesting.download_btc_eth_independent \
              --days "${{ inputs.days || '365' }}" \
              --min-history-days "${{ inputs.min_history_days || '120' }}" \
              --out data
          else
            echo "Using the previously downloaded and validated BTC/ETH dataset."
          fi

      - name: Backtest every valid BTC ETH timeframe independently
        run: |
          python -m backtesting.backtest_btc_eth_timeframes \
            --data-dir data \
            --fee-slippage-pct "${{ inputs.fee_slippage_pct || '0.12' }}" \
            --funding-bps-per-8h "${{ inputs.funding_bps_per_8h || '0' }}"

      - name: Backtest actual live multi-timeframe signal strategy
        run: |
          python -m backtesting.backtest \
            --data-dir data \
            --symbols BTCUSDT,ETHUSDT \
            --fee-slippage-pct "${{ inputs.fee_slippage_pct || '0.12' }}" \
            --funding-bps-per-8h "${{ inputs.funding_bps_per_8h || '0' }}" \
            --max-hold-bars 96

      - name: Backtest all five independent strategy engines
        run: |
          python -m backtesting.multi_strategy \
            --data-dir data \
            --fee-slippage-pct "${{ inputs.fee_slippage_pct || '0.12' }}"

      - name: Upload BTC ETH data and all reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: at-trendhive-multi-strategy-backtest
          path: |
            data/
            backtest_results/
          if-no-files-found: warn
