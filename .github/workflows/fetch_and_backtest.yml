name: Bitget Perpetual Research and Backtest

on:
  workflow_dispatch:
    inputs:
      research_scope:
        description: "Research universe"
        required: true
        type: choice
        options:
          - btc_eth
          - all_markets
        default: btc_eth
      days:
        description: "Requested historical lookback days (maximum 2000)"
        required: true
        default: "365"
      min_history_days:
        description: "Minimum acceptable history days per market/timeframe"
        required: true
        default: "120"
      fee_slippage_pct:
        description: "Estimated combined round-trip fees + slippage (% notional)"
        required: true
        default: "0.12"
      funding_bps_per_8h:
        description: "Legacy BTC/ETH funding sensitivity assumption (not historical funding)"
        required: true
        default: "0"
      seed_artifact_run_id:
        description: "Reuse a completed all-market data artifact from this workflow run (0 disables reuse)"
        required: true
        default: "41723310248"
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

permissions:
  contents: read
  actions: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run deterministic tests
        run: python -m pytest -q

      - name: Reuse previously downloaded BTC ETH dataset
        if: ${{ inputs.research_scope != 'all_markets' }}
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: at-trendhive-btc-eth-timeframe-backtest
          run-id: 41714564038
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          path: .

      - name: Download BTC ETH if no reusable dataset exists
        if: ${{ inputs.research_scope != 'all_markets' }}
        run: |
          if [ ! -f data/timeframe_manifest.json ]; then
            python -m backtesting.download_btc_eth_independent \
              --days "${{ inputs.days || '365' }}" \
              --min-history-days "${{ inputs.min_history_days || '120' }}" \
              --out data
          else
            echo "Using the previously downloaded and validated BTC/ETH dataset."
          fi

      - name: Reuse recovered all-market dataset
        if: ${{ inputs.research_scope == 'all_markets' && inputs.seed_artifact_run_id != '0' }}
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: at-trendhive-all_markets-research
          run-id: ${{ inputs.seed_artifact_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          path: .

      - name: Prepare recovered dataset manifest
        if: ${{ inputs.research_scope == 'all_markets' && hashFiles('data/**') != '' }}
        run: |
          mkdir -p data
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('data/download_manifest.json')
          if not p.exists():
              p.write_text(json.dumps({
                  'exchange': 'Bitget',
                  'market_type': 'linear USDT-settled perpetual swaps',
                  'recovered_from_artifact_run': ${{ inputs.seed_artifact_run_id }},
                  'data_provenance': 'recovered workflow artifact; no new candles fabricated',
                  'timeframes': ['15m', '1h', '4h', '1d']
              }, indent=2))
          PY

      - name: Discover and download every eligible Bitget USDT perpetual crypto market
        if: ${{ inputs.research_scope == 'all_markets' && !hashFiles('data/download_manifest.json') }}
        run: |
          python -m backtesting.download_bitget \
            --symbols auto \
            --days "${{ inputs.days || '365' }}" \
            --min-history-days "${{ inputs.min_history_days || '120' }}" \
            --min-quote-volume 500000 \
            --absolute-min-quote-volume 250000 \
            --max-symbols 0 \
            --out data

      - name: Backtest BTC ETH timeframe baselines
        if: ${{ inputs.research_scope != 'all_markets' }}
        run: |
          python -m backtesting.backtest_btc_eth_timeframes \
            --data-dir data \
            --fee-slippage-pct "${{ inputs.fee_slippage_pct || '0.12' }}" \
            --funding-bps-per-8h "${{ inputs.funding_bps_per_8h || '0' }}"

      - name: Backtest current BTC ETH Telegram signal strategy
        if: ${{ inputs.research_scope != 'all_markets' }}
        run: |
          python -m backtesting.backtest \
            --data-dir data \
            --symbols BTCUSDT,ETHUSDT \
            --fee-slippage-pct "${{ inputs.fee_slippage_pct || '0.12' }}" \
            --funding-bps-per-8h "${{ inputs.funding_bps_per_8h || '0' }}" \
            --max-hold-bars 96

      - name: Backtest five preserved engines on BTC ETH
        if: ${{ inputs.research_scope != 'all_markets' }}
        run: |
          python -m backtesting.multi_strategy \
            --data-dir data \
            --fee-slippage-pct "${{ inputs.fee_slippage_pct || '0.12' }}"

      - name: Backtest preserved engines across all downloaded markets and timeframes
        if: ${{ inputs.research_scope == 'all_markets' }}
        run: |
          python -m backtesting.full_market_runner \
            --data-dir data \
            --fee-slippage-pct "${{ inputs.fee_slippage_pct || '0.12' }}" \
            --minimum-trades 30

      - name: Upload research data and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: at-trendhive-${{ inputs.research_scope || 'btc_eth' }}-research
          path: |
            data/
            backtest_results/
          if-no-files-found: warn
          retention-days: 90
