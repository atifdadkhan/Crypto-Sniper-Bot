
name: Fetch FULL Bitget Market and Backtest

on:
  workflow_dispatch:
    inputs:
      days:
        description: "Historical days to fetch"
        required: true
        default: "365"
      min_quote_volume:
        description: "Minimum 24h quote volume in USDT"
        required: true
        default: "500000"
      max_symbols:
        description: "Maximum markets; 0 means ALL"
        required: true
        default: "0"
      fee_slippage_pct:
        description: "Estimated fees + slippage percent"
        required: true
        default: "0.12"

permissions:
  contents: read

jobs:
  fetch-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Discover and download all eligible Bitget USDT perpetual markets
        run: |
          python -m backtesting.download_bitget --symbols auto \
            --days "${{ inputs.days }}" \
            --min-quote-volume "${{ inputs.min_quote_volume }}" \
            --max-symbols "${{ inputs.max_symbols }}" --out data

      - name: Backtest every complete downloaded market
        run: |
          python -m backtesting.backtest --data-dir data --symbols auto \
            --fee-slippage-pct "${{ inputs.fee_slippage_pct }}"

      - name: Upload historical data and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: at-trendhive-full-bitget-market-backtest
          path: |
            data/
            backtest_results/
          if-no-files-found: warn
