name: Fetch BTC ETH Bitget Data and Timeframe Backtest

on:
  workflow_dispatch:
    inputs:
      days:
        description: "Historical days to fetch"
        required: true
        default: "365"
      min_history_days:
        description: "Minimum acceptable history for each timeframe"
        required: true
        default: "120"
      fee_slippage_pct:
        description: "Estimated combined round-trip fees + slippage (% notional)"
        required: true
        default: "0.12"
      funding_bps_per_8h:
        description: "Funding sensitivity assumption (bps per 8h; not historical funding)"
        required: true
        default: "0"

permissions:
  contents: read

jobs:
  fetch-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run deterministic tests
        run: pytest -q

      - name: Download BTC and ETH independently by timeframe
        run: |
          python -m backtesting.download_btc_eth_independent \
            --days "${{ inputs.days }}" \
            --min-history-days "${{ inputs.min_history_days }}" \
            --out data

      - name: Backtest every valid BTC ETH timeframe independently
        run: |
          python -m backtesting.backtest_btc_eth_timeframes \
            --data-dir data \
            --fee-slippage-pct "${{ inputs.fee_slippage_pct }}" \
            --funding-bps-per-8h "${{ inputs.funding_bps_per_8h }}"

      - name: Upload BTC ETH timeframe data and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: at-trendhive-btc-eth-timeframe-backtest
          path: |
            data/
            backtest_results/
          if-no-files-found: warn
