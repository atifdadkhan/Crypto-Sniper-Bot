name: Bitget Live Public Data Smoke

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bitget-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Validate public Bitget markets, completed candles and live quotes
        run: python -m scripts.live_market_smoke
      - name: Report sanitized data-quality reasons for repeated scanner skips
        run: python -m scripts.skipped_symbol_probe
